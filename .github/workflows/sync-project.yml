name: Sync Project #67

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (no changes)'
        required: false
        default: 'false'
        type: boolean

permissions:
  issues: write
  pull-requests: read

jobs:
  sync:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.issue.state == 'open') ||
      (github.event_name == 'pull_request' && github.event.pull_request.state == 'open')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Full reconcile scans the whole project (10000-item GraphQL item-list) to find
      # gaps. That is expensive in GraphQL quota and must NOT run on every issue/PR
      # open event — a burst of creations would exhaust the hourly quota and take down
      # the whole workflow (#2970). It only runs on the daily schedule and manual
      # dispatch. Issue/PR opens use the targeted item-add steps below (one mutation
      # each); field-setting for newly-added issues is picked up by this daily run.
      #
      # The reconcile runs once PER TRACKED REPOSITORY. Project #67 is the dispatch board for
      # the whole system, but part of the work lives in the submodule repository
      # (jsboige/jsboige-mcp-servers) -- 29 open issues on 2026-09-08, none of which had ever
      # reached the board, because this workflow only ever reconciled its own repository.
      #
      # The asymmetry below is deliberate: the event-driven steps fire on `issues: opened` IN
      # THIS REPOSITORY ONLY -- a workflow cannot observe another repo's events. A submodule
      # issue therefore reaches the board on the next daily reconcile, up to 24 h later, never
      # within seconds like a roo-extensions one. Closing that would mean installing a workflow
      # in the submodule repository; the latency is accepted instead.
      - name: Sync issues to Project #67 (full reconcile, per repository)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $params = @{ Execute = $true }
          if ('${{ inputs.dry_run }}' -eq 'true') {
            $params = @{ DryRun = $true }
          }
          $failed = @()
          foreach ($repo in @('roo-extensions', 'jsboige-mcp-servers')) {
            Write-Host "::group::reconcile $repo"
            ./scripts/github/sync-issues-to-project.ps1 -Repo $repo @params
            # A script `exit 1` does NOT throw under ErrorActionPreference=Stop: without this
            # check a failing repository would be swallowed by the next iteration and the step
            # would still go green.
            if ($LASTEXITCODE -ne 0) { $failed += "$repo (exit $LASTEXITCODE)" }
            Write-Host "::endgroup::"
          }
          if ($failed.Count -gt 0) { throw "reconcile failed for: $($failed -join ', ')" }

      - name: Add new issue to Project #67
        if: github.event_name == 'issues'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $issueUrl = "${{ github.event.issue.html_url }}"
          Write-Host "Adding issue to Project #67: $issueUrl"
          $result = gh project item-add 67 --owner jsboige --url $issueUrl 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "[OK] Issue added to Project #67"
            exit 0
          }
          # Measured 2026-09-08: `gh project item-add` is IDEMPOTENT -- re-adding an
          # item already on the board exits 0 with empty output. A non-zero exit is
          # therefore NEVER "already exists". The previous wording said exactly that
          # and turned a hard credential failure ("unknown owner type") into a green
          # run: the at-open attach was broken for ~13 h while every run stayed green.
          Write-Host "[FAIL] item-add exited $LASTEXITCODE : $result"
          # Which class of failure? Tolerating one only makes sense while the daily
          # reconcile can still catch it -- and the reconcile runs on THIS SAME token.
          # So: is the credential itself dead, or was this one call merely refused?
          #
          # Measured 2026-09-08: the outage that motivated this PR was NOT a dead
          # token. It was the user-level GraphQL budget of `jsboige`, drained by
          # interactive project enumerations -- the CI shares that budget because it
          # runs as the same user. `gh` surfaces it as "unknown owner type", which is
          # the message of its refused owner-resolution query, not of a scope problem.
          # It cleared on its own within the hour, and the daily reconcile covers it.
          #
          # A GraphQL probe (`gh project view`) CANNOT separate the two: it fails in
          # both cases, so it would hard-fail the run on a condition that self-heals.
          # REST and GraphQL carry SEPARATE budgets -- a REST call keeps working while
          # GraphQL is refused, and fails only when the credential itself is gone.
          # Do NOT reach for `gh api rate_limit` instead: measured twice announcing
          # 5000/5000 while every GraphQL call was being refused.
          # Residual case: if the REST budget is spent too, this reports a dead
          # credential wrongly. Accepted -- a red run gets read, whereas the green run
          # this PR removes hid a real failure for ~13 h.
          gh api user 1>$null 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::PROJECT_TOKEN no longer authenticates at all (REST probe 'gh api user' failed too, so this is not a GraphQL-budget refusal). The daily reconcile shares this credential and will NOT recover it. Issue $issueUrl is not on the board."
            exit 1
          }
          Write-Host "::warning::Issue $issueUrl was not added to Project #67, but PROJECT_TOKEN still authenticates (REST probe OK) -- GraphQL budget exhaustion, or an item-specific error. The daily reconcile should pick it up within 24 h."
          exit 0

      - name: Add new PR to Project #67
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $prUrl = "${{ github.event.pull_request.html_url }}"
          Write-Host "Adding PR to Project #67: $prUrl"
          $result = gh project item-add 67 --owner jsboige --url $prUrl 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "[OK] PR added to Project #67"
            exit 0
          }
          # Measured 2026-09-08: `gh project item-add` is IDEMPOTENT -- re-adding an
          # item already on the board exits 0 with empty output. A non-zero exit is
          # therefore NEVER "already exists". The previous wording said exactly that
          # and turned a hard credential failure ("unknown owner type") into a green
          # run: the at-open attach was broken for ~13 h while every run stayed green.
          Write-Host "[FAIL] item-add exited $LASTEXITCODE : $result"
          # Which class of failure? Tolerating one only makes sense while the daily
          # reconcile can still catch it -- and the reconcile runs on THIS SAME token.
          # So: is the credential itself dead, or was this one call merely refused?
          #
          # Measured 2026-09-08: the outage that motivated this PR was NOT a dead
          # token. It was the user-level GraphQL budget of `jsboige`, drained by
          # interactive project enumerations -- the CI shares that budget because it
          # runs as the same user. `gh` surfaces it as "unknown owner type", which is
          # the message of its refused owner-resolution query, not of a scope problem.
          # It cleared on its own within the hour, and the daily reconcile covers it.
          #
          # A GraphQL probe (`gh project view`) CANNOT separate the two: it fails in
          # both cases, so it would hard-fail the run on a condition that self-heals.
          # REST and GraphQL carry SEPARATE budgets -- a REST call keeps working while
          # GraphQL is refused, and fails only when the credential itself is gone.
          # Do NOT reach for `gh api rate_limit` instead: measured twice announcing
          # 5000/5000 while every GraphQL call was being refused.
          # Residual case: if the REST budget is spent too, this reports a dead
          # credential wrongly. Accepted -- a red run gets read, whereas the green run
          # this PR removes hid a real failure for ~13 h.
          gh api user 1>$null 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::PROJECT_TOKEN no longer authenticates at all (REST probe 'gh api user' failed too, so this is not a GraphQL-budget refusal). The daily reconcile shares this credential and will NOT recover it. PR $prUrl is not on the board."
            exit 1
          }
          Write-Host "::warning::PR $prUrl was not added to Project #67, but PROJECT_TOKEN still authenticates (REST probe OK) -- GraphQL budget exhaustion, or an item-specific error. The daily reconcile should pick it up within 24 h."
          exit 0

      - name: Label nudge for new issues
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels || [];
            const labelNames = labels.map(l => l.name);

            const hasType = ['bug', 'enhancement', 'documentation'].some(l => labelNames.includes(l));
            const hasAgent = ['claude-only', 'roo-schedulable'].some(l => labelNames.includes(l));

            if (!hasType || !hasAgent) {
              const missing = [];
              if (!hasType) missing.push('type: `bug`, `enhancement`, or `documentation`');
              if (!hasAgent) missing.push('agent: `claude-only` or `roo-schedulable`');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: [
                  '**Missing labels detected:**',
                  '',
                  ...missing.map(m => `- ${m}`),
                  '',
                  'Please add the missing labels so Project #67 fields are set correctly.',
                  '',
                  '---',
                  `*Automated by [sync-project.yml](${context.payload.repository.html_url}/blob/main/.github/workflows/sync-project.yml) (#1835)*`
                ].join('\n')
              });
            }
