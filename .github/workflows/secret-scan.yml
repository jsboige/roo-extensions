name: Secret Scan

# PORTER de CoursIA secret-scan.yml (#3673, inventaire gates candidat n°1).
# Comble le vide roo-extensions : security.md exige un pre-commit manuel
# (`git diff --cached` sans patterns secrets) -- aucun organe CI ne scannait
# le depot. GitHub secret scanning ne couvre que les motifs connus, pas les
# cles genuinement leakables (generic-api-key, entropy).
#
# Deux surfaces doivent s'accorder (lecon CoursIA #10139 : un pre-commit 8.21.2
# vert pendant que la CI tournait 8.24.3 = garde inerte) :
#   1. pre-commit hook     -> .pre-commit-config.yaml `rev: vX.Y.Z`
#   2. ce workflow         -> GITLEAKS_VERSION ci-dessous
# La parite est assertee mecaniquement par scripts/docs/scan-doc-tree-drift.ps1
# (check gitleaks-parity, executé par la suite Pester unit-pester).
#
# Binaire recupere depuis la release GitHub amont, epingle par GITLEAKS_VERSION
# + GITLEAKS_SHA256 (digest de l'asset linux_x64, verifie AVANT toute
# extraction privilegiee -- un tag de release epingle la version mais
# n'authentifie PAS les octets ; les assets d'une release sont remplaçables
# independamment du depot). PAS via gitleaks/gitleaks-action@v2 : le tag @v2
# est la version de l'ACTION, pas celle du binaire, qui vit dans l'env du
# wrapper avec un fallback code en dur -- une epingle possedee par un tiers,
# revisable sans commit ici.
# TOUT bump de GITLEAKS_VERSION exige de re-epingler GITLEAKS_SHA256 depuis
# gitleaks_<v>_checksums.txt de la nouvelle release (et re-bumper le rev du
# pre-commit -- la parite est assertee par scan-doc-tree-drift.ps1).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Hebdo, minute off-:00 (anti-stampede). Les regles gitleaks evoluent et
    # detectent retroactivement -- le re-scan periodique de l'historique est
    # le filet de rattrapage.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: "v8.24.3"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Pas de submodules : les depots fils (jsboige-mcp-servers) doivent
          # adopter leur propre gate (recommandation de l'inventaire #3673) ;
          # roo-code/ est un miroir de reference amont, pas notre contenu.

      - name: Install pinned gitleaks binary (digest-verified)
        # Review #3685 : l'archive ne doit JAMAIS etre extraite en privilege
        # sans que ses octets aient ete authentifies. Le digest est epingle
        # ICI (pas recupere a la volee sur la meme release mutable) :
        # 9991e0b2... = gitleaks_8.24.3_linux_x64.tar.gz, croise localement
        # avec gitleaks_8.24.3_checksums.txt de la release v8.24.3.
        env:
          GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
        run: |
          asset="gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
          curl -sSL -o "$RUNNER_TEMP/${asset}" \
            "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/${asset}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${asset}" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f "${RUNNER_TEMP}/${asset}" gitleaks
          gitleaks version

      - name: Scan full git history
        # --exit-code 1 -> job rouge sur findings. Allowlist des faux positifs
        # tries 2026-09-16 : .gitleaks.toml (docs vendors, fixtures de test,
        # placeholder explicite). Mesure locale : 4419 commits, ~1 min 30.
        run: gitleaks git . --redact --config .gitleaks.toml --verbose --exit-code 1
