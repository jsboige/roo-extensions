name: CI

on:
  push:
    branches: [main]
    paths:
      - 'mcps/internal'
      - 'mcps/internal/**'
      - '.github/workflows/ci.yml'
      - 'scripts/scheduling/**'
      # Sources of the static harnesses below: without these, a change to the
      # worktree classifier landing on main would never re-run its own check.
      - 'scripts/maintenance/worktree-classify.ps1'
      - 'scripts/testing/harness/**'
  pull_request:
    branches: [main]
    # No paths filter — CI always runs on PRs to enable required status checks
  workflow_dispatch:

jobs:
  check-submodule-pointer:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if mcps/internal changed
        id: changed
        run: |
          if git diff --name-only origin/main...HEAD | grep -q '^mcps/internal$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate submodule pointer is reachable
        if: steps.changed.outputs.changed == 'true'
        run: |
          # Get the submodule commit this PR points to
          SUBMOD_COMMIT=$(git ls-tree HEAD mcps/internal | awk '{print $3}')
          echo "Submodule pointer: $SUBMOD_COMMIT"

          # Get the submodule remote URL
          SUBMOD_URL=$(git config -f .gitmodules --get submodule.mcps/internal.url)
          echo "Submodule URL: $SUBMOD_URL"

          # Clone just the metadata (bare repo, no working tree)
          git clone --bare "$SUBMOD_URL" /tmp/submod-bare

          # Check if the commit is reachable from main
          if git -C /tmp/submod-bare merge-base --is-ancestor "$SUBMOD_COMMIT" main; then
            echo "OK: $SUBMOD_COMMIT is reachable from submodule origin/main"
          else
            echo "::error::Submodule pointer $SUBMOD_COMMIT is NOT reachable from origin/main"
            echo "This is likely a pre-squash-merge SHA. Update the pointer to the actual merge commit."
            echo ""
            echo "Recent submodule merges on main:"
            git -C /tmp/submod-bare log --oneline main -5
            exit 1
          fi

  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    defaults:
      run:
        working-directory: mcps/internal/servers/roo-state-manager

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        # npm ci (pas npm install) : installe exactement l'arbre du package-lock.json
        # committe dans le submodule. Sans ca, une publication amont peut casser ce job
        # sans aucun commit fautif (incident @qdrant/js-client-rest, 2026-08-04 — #3037).
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests (CI config - excludes platform-dependent tests)
        run: npx vitest run --config vitest.config.ci.ts --reporter=default

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node${{ matrix.node-version }}
          path: mcps/internal/servers/roo-state-manager/test-results/
          retention-days: 7

  # Static scheduling-harness (#2985): test-escalation.ps1 is a pure in-memory
  # harness (368 lines, 46 assertions, no network/Docker/schtask/disk writes) that
  # reads start-claude-worker.ps1 as text and compares strings. It ran nowhere —
  # the IDLE assertion sat false for 62 days unseen. pwsh is preinstalled on
  # ubuntu-latest; the script resolves the worker via $PSScriptRoot (cwd-independent).
  scheduling-harness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run scheduling static harness
        shell: bash
        run: pwsh -File scripts/scheduling/test-escalation.ps1

      # Same reasoning as above, applied to the worktree cleanup classifier:
      # Get-WorktreeClass decides whether a worktree gets DELETED. It is pure
      # (no git, no gh, no disk), so it belongs on the wired path rather than in
      # scripts/testing/unit/, where eleven Pester files execute nowhere.
      - name: Run worktree classifier static harness
        shell: bash
        run: pwsh -File scripts/testing/harness/test-worktree-classify.ps1

      # Same reasoning again: start-meta-audit.ps1 resolved `claude` to the npm
      # claude.ps1, which Start-Process cannot launch — the audit exit 1'd in ~2s
      # on every run, and the wscript //B launcher swallowed the error. The guard
      # is static (text + AST of the production script), so it runs here rather
      # than needing a Windows runner.
      - name: Run meta-audit claude resolution harness
        shell: bash
        run: pwsh -File scripts/testing/harness/test-metaaudit-claude-resolution.ps1

      # Same reasoning, applied to mcp-chain-watchdog.ps1, whose repair drops
      # every live bot session. Two ways to be wrong, both measured on ai-01 on
      # 2026-08-16: it restarted the chain for a 20s stall (nominal round-trip
      # 589ms, but a probe that took 23_164ms SUCCEEDED), and it blamed po-2023
      # for a wedge local to ai-01 because it compared URL spellings rather than
      # network hops. Static (text + AST), so no Windows runner needed.
      - name: Run watchdog slow-vs-dead harness
        shell: bash
        run: pwsh -File scripts/testing/harness/test-watchdog-slow-vs-dead.ps1
