# MyIA MCP Infrastructure
# Single container serving all MCPs via SSE on port 9090
#
# mcp-proxy runs tbxark/mcp-proxy extended with sk-agent Python deps.
# SearXNG runs as a stdio subprocess inside the container; /sk-agent/ is an HTTP
# relay to the dedicated sk-agent container :8100/mcp (since 22/09) — the baked-in
# /opt/sk-agent/ copy is vestigial while the live config stays on the relay.
#
# Usage:
#   docker compose build --no-cache   # Rebuild after code changes
#   docker compose up -d              # Start
#   docker compose logs -f            # Follow logs

services:
  mcp-proxy:
    build:
      context: ..
      dockerfile: docker/mcp-proxy/Dockerfile
    image: myia-mcp-proxy:latest
    container_name: myia-mcp-proxy
    ports:
      - "9090:9090"
    volumes:
      - ./mcp-proxy/config.json:/config/config.json:ro
      - ../mcps/internal/servers/sk-agent/sk_agent_config.json:/opt/sk-agent/sk_agent_config.json:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "true"]
      interval: 60s
    restart: unless-stopped
    # Fleet bounds (Maintenance#303, user mandate 07/11): an unbounded container
    # can take the whole WSL VM it shares with qdrant/postgres. Measured
    # 07/11 18:00Z: ~150 MiB, 66 PIDs. Limits live HERE, not in `docker update`,
    # because an update is lost at the next recreate.
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 512
